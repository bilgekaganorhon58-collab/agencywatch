name: AgencyWatch Monitor Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: agencywatch-monitor-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-monitor:
    name: Trigger monitoring endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_ENDPOINT_URL: ${{ secrets.CRON_ENDPOINT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Send monitoring request
        run: |
          if [ -z "$CRON_ENDPOINT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Required secrets are missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_ENDPOINT_URL}"
